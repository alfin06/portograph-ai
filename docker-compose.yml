# On a server:  docker compose up -d --build
# Logs:         docker compose logs -f   (or data/logs/*.log)
# Stop:         docker compose down
services:
  portograph:
    build: .
    image: portograph-ai
    restart: unless-stopped
    env_file: .env          # same file as on Windows; never baked into the image
    environment:
      WEB_HOST: 0.0.0.0     # inside the container; needs WEB_PASSWORD in .env
    ports:
      # Dashboard on the server's own localhost only. Reach it with an SSH tunnel:
      #   ssh -L 8000:127.0.0.1:8000 you@server   then open http://127.0.0.1:8000
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data    # database, backups and logs: the only state to move
    stop_grace_period: 30s
    # Hardening: read-only system files, no privilege escalation, no Linux capabilities
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
